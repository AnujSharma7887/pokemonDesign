<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="border">
      <div class="main-div">
        <div class="left">
          <img
            class="logo"
            src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/98/International_Pok%C3%A9mon_logo.svg/1280px-International_Pok%C3%A9mon_logo.svg.png"
            alt=""
          />
          <div class="textbox">
            <h3>POKEMON GEN I</h3>
            <h1>Pikachu</h1>
            <p class="description">
              Pikachu is an Electric-type Pokémon introduced in Generation I.
              Pikachu are small, chubby, and incredibly cute mouse-like Pokémon.
              They are almost completely covered by yellow fur.
            </p>
            <h4 class="counter">-------01 / 08</h4>
          </div>
          <img
            class="watermark"
            src="https://assets.streamlinehq.com/image/private/w_300,h_300,ar_1/f_auto/v1/icons/vector-icons-7/pokeball-xeg9gc4xzwluseur3c3mm.png/pokeball-qdt0o2i0d34nyhk4opt88.png?_a=DATAiZAAZAA0"
            alt=""
          />
        </div>
        <div class="right">
          <img class="menu" src="./menu-line.png" alt="" />
          <div class="slider-dots">
            <span class="active"></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
        <img
          class="pokemon"
          src="https://www.freeiconspng.com/uploads/pokemon-png-3.png"
          alt=""
        />
      </div>
    </div>
  </body>
</html>
